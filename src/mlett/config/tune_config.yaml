# MLETT Hyperparameter Tuning Configuration

# Base configuration file to inherit data/split/features settings
base_config: "src/mlett/config/config.yaml"

# Random seed reset before each experiment (ensures fair comparison)
random_seed: 42

# Tuning method: "grid" (cartesian product) or "optuna" (Bayesian optimization)
tune_method: "optuna"

# --- Grid search space (only used when tune_method="grid") ---
param_space:
  max_depth: [3, 5]
  learning_rate: [0.01, 0.05]
  n_estimators: [500, 1000]
  min_child_weight: [3, 10]
  reg_alpha: [0.1, 1.0]
  reg_lambda: [1.0, 5.0]

# --- Optuna search space (only used when tune_method="optuna") ---
search_space:
  max_depth:
    type: "int"
    low: 3
    high: 8
  learning_rate:
    type: "float"
    low: 0.001
    high: 0.1
    log: true
  n_estimators:
    type: "int"
    low: 200
    high: 2000
  min_child_weight:
    type: "int"
    low: 1
    high: 10
  reg_alpha:
    type: "float"
    low: 0.01
    high: 1.0
    log: true
  reg_lambda:
    type: "float"
    low: 0.5
    high: 5.0

# --- Optuna configuration ---
optuna:
  n_trials: 50
  sampler: "TPESampler"           # TPESampler / RandomSampler / CMAESampler
  pruner: "MedianPruner"          # None / MedianPruner
  pruner_warmup_steps: 10
  pruner_interval_steps: 5