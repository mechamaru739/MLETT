# MLETT Configuration File

# Data configuration
data:
  raw_data_path: "data/raw/ETTh1.csv"
  processed_data_dir: "data/processed"
  datetime_column: "date"
  target_column: "OT"
  
  # Sensor columns (used as input features, also for rolling statistics in industrial mode)
  numerical_features:
    - "HUFL"
    - "HULL"
    - "MUFL"
    - "MULL"
    - "LUFL"
    - "LULL"
  
  # Categorical features (if any)
  categorical_features: []

# Data splitting configuration
# Ratios are applied to raw data BEFORE windowing to prevent data leakage
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Feature engineering configuration
features:
  # Feature mode: "flat" or "industrial"
  #   "flat" -> flatten (window_size x n_features) matrix (e.g. 24x15=360d)
  #   "industrial" -> compact (24+12+6=42d) features:
  #     rolling stats + recent values + target-point time features
  feature_mode: "industrial"
  
  # Column groups for industrial feature extraction
  # sensor_columns uses data.numerical_features above
  time_columns:
    - "hour_sin"
    - "hour_cos"
    - "month_sin"
    - "month_cos"
    - "day_of_week"
    - "is_weekend"
  
  # Time-based features (applied before windowing)
  extract_time_features: true
  include_cyclical_features: true
  
  # Sliding window configuration for time series forecasting
  # Each sample: past `window_size` hours of features -> future `forecast_horizon` hours of OT
  window_size: 24
  forecast_horizon: 1
  window_step: 1
  
  # Target mode: "absolute" predicts OT directly, "delta" predicts OT[t+h] - OT[t+h-1]
  target_mode: "delta"

# Model configuration
model:
  type: "xgboost"
  
  # XGBoost parameters (optimized for ETT dataset, anti-overfitting)
  xgboost:
    # --- Objective & hardware ---
    objective: "reg:absoluteerror"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"              # Histogram algorithm: faster + inherent regularization
    
    # --- Training strategy (low LR + high n_estimators) ---
    learning_rate: 0.01              # Moderate learning rate for industrial features (42d)
    n_estimators: 1000               # More trees to compensate low LR
    early_stopping_rounds: 50        # Longer patience for low LR
    
    # --- Complexity control ---
    max_depth: 5                     # Moderate depth for compact feature space
    min_child_weight: 5              # Minimum samples per leaf prevents extreme splits
    
    # --- Stochastic subsampling ---
    subsample: 0.7                   # Row sampling per tree
    colsample_bytree: 0.8           # Higher ratio for 42d (less aggressive than 360d)
    colsample_bylevel: 0.8          # Higher ratio for 42d
    
    # --- Regularization ---
    reg_alpha: 0.5                   # L1 regularization: sparsity, kill useless features
    reg_lambda: 2.0                  # L2 regularization: smooth weights, reduce sensitivity

# Training configuration
training:
  use_validation: true
  save_model: true

# Paths configuration
paths:
  results_dir: "results"

# Evaluation configuration
evaluation:
  metrics:
    - "MSE"
    - "RMSE"
    - "MAE"
    - "R2"
    - "MAPE"
  
  # Thresholds for good performance
  performance_thresholds:
    R2: 0.8
    MAPE: 20.0

# Reproducibility
random_seed: 42