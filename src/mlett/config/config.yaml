# MLETT Configuration File

# Data configuration
data:
  raw_data_path: "data/raw/ETTh1.csv"
  processed_data_dir: "data/processed"
  datetime_column: "date"
  target_column: "OT"
  
  # Feature columns (used as input to sliding window)
  numerical_features:
    - "HUFL"
    - "HULL"
    - "MUFL"
    - "MULL"
    - "LUFL"
    - "LULL"
  
  # Categorical features (if any)
  categorical_features: []

# Data splitting configuration
# Ratios are applied to raw data BEFORE windowing to prevent data leakage
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Feature engineering configuration
features:
  # Time-based features
  extract_time_features: true
  include_cyclical_features: true
  
  # Rolling window features (not used in sliding window mode)
  create_rolling_features: false
  rolling_windows: [3, 6, 12, 24]
  
  # Lag features (not used in sliding window mode)
  create_lag_features: false
  lags: [1, 2, 3, 6, 12, 24]
  
  # Sliding window configuration for time series forecasting
  # Each sample: past `window_size` hours of features -> future `forecast_horizon` hours of OT
  window_size: 24
  forecast_horizon: 1
  window_step: 1
  
  # Target mode: "absolute" predicts OT directly, "delta" predicts OT[t+h] - OT[t+h-1]
  target_mode: "delta"

# Model configuration
model:
  type: "xgboost"
  
  # XGBoost parameters (optimized for ETT dataset, anti-overfitting)
  xgboost:
    # --- Objective & hardware ---
    objective: "reg:absoluteerror"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"              # Histogram algorithm: faster + inherent regularization
    
    # --- Training strategy (low LR + high n_estimators) ---
    learning_rate: 0.001               # Small steps for stable convergence
    n_estimators: 500                # More trees to compensate low LR
    early_stopping_rounds: 50         # Longer patience for low LR
    
    # --- Complexity control (core anti-overfitting) ---
    max_depth: 5                      # Shallow trees prevent memorizing noise
    min_child_weight: 3                # Minimum samples per leaf prevents extreme splits
    
    # --- Stochastic subsampling ---
    subsample: 0.7                   # Row sampling per tree
    colsample_bytree: 0.4            # Column sampling per tree (important for high-dim input)
    colsample_bylevel: 0.7           # Column sampling per split level
    
    # --- Regularization (suppress overfitting) ---
    reg_alpha: 0.5                    # L1 regularization: sparsity, kill useless features
    reg_lambda: 2.0                   # L2 regularization: smooth weights, reduce sensitivity

# Training configuration
training:
  use_validation: true
  save_model: true

# Paths configuration
paths:
  results_dir: "results"

# Evaluation configuration
evaluation:
  metrics:
    - "MSE"
    - "RMSE"
    - "MAE"
    - "R2"
    - "MAPE"
  
  # Thresholds for good performance
  performance_thresholds:
    R2: 0.8
    MAPE: 20.0

# Reproducibility
random_seed: 42